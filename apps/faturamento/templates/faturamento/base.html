{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Faturamento{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'intranet/css/navbar.css' %}">
  <style>
    :root {
      --fat-navy:  #1a1a2e;
      --fat-blue:  #0d6efd;
      --fat-blue2: #3d8bfd;
      --fat-green: #198754;
      --fat-light: #f4f7fb;
    }
    body { background: #eef1f6; font-family: 'Segoe UI', sans-serif; font-size: .88rem; }

    #fat-navbar {
      background: #A7A3AB !important;
      padding: 0.6rem 1.5rem;
    }
    #fat-navbar .navbar-brand {
      color: #282828 !important;
      font-weight: 700;
      font-size: 1rem;
    }
    #fat-navbar .nav-link {
      color: rgba(40,40,40,.85) !important;
      font-size: 0.82rem;
      padding: 0.4rem 0.8rem !important;
      border-radius: 6px;
      transition: background .2s;
    }
    #fat-navbar .nav-link:hover {
      background: rgba(0,0,0,.1);
      color: #282828 !important;
    }

    .fat-header {
      background: #fff; border-bottom: 3px solid var(--fat-navy);
      padding: 1rem 1.5rem .8rem;
    }
    .fat-header h1 {
      font-size: 1.15rem; font-weight: 800; color: var(--fat-navy); margin: 0 0 2px;
      letter-spacing: .02em; text-transform: uppercase;
    }
    .fat-header p { font-size: .78rem; color: #6c757d; margin: 0; }
    .fat-breadcrumb { font-size: .78rem; margin-bottom: 4px; }
    .fat-breadcrumb a { color: #6c757d; text-decoration: none; }
    .fat-breadcrumb a:hover { text-decoration: underline; }
    .fat-breadcrumb .sep { color: #adb5bd; margin: 0 .35rem; }

    .fat-cards { display: flex; gap: 1rem; flex-wrap: wrap; margin: 1.25rem 1.5rem; }
    .fat-card {
      background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.06);
      padding: 1rem 1.4rem; flex: 1; min-width: 180px; border-top: 4px solid var(--fat-blue);
    }
    .fat-card.card-locacao { border-top-color: var(--fat-green); }
    .fat-card.card-vendas { border-top-color: #c8a951; }
    .fat-card.card-total { border-top-color: var(--fat-navy); background: var(--fat-navy); }
    .fat-card.card-total .fat-card-label,
    .fat-card.card-total .fat-card-value { color: #fff; }
    .fat-card-label {
      font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
      color: #6c757d; margin-bottom: 4px;
    }
    .fat-card-value { font-size: 1.5rem; font-weight: 800; color: var(--fat-navy); }

    .fat-section { margin: 0 1.5rem 1.5rem; }
    .fat-section-title {
      font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
      color: #6c757d; margin-bottom: .6rem;
    }
    .fat-table-wrap {
      background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.06); overflow: hidden;
    }
    .fat-table { font-size: .85rem; margin: 0; }
    .fat-table thead th {
      background: var(--fat-navy); color: #fff; font-size: .72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .05em; padding: .6rem .9rem; border: none;
      white-space: nowrap;
    }
    .fat-table tbody td { padding: .55rem .9rem; border-bottom: 1px solid #eef1f6; vertical-align: middle; }
    .fat-table tbody tr:last-child td { border-bottom: none; }
    .fat-table tbody tr.fat-row-link { cursor: pointer; }
    .fat-table tbody tr.fat-row-link:hover { background: #f4f7fb; }
    .fat-table tfoot td {
      background: var(--fat-light); font-weight: 700; padding: .6rem .9rem;
      border-top: 2px solid #dee2e6;
    }
    .fat-table td.num, .fat-table th.num { text-align: right; }
    .fat-group-row td {
      background: var(--fat-light); font-weight: 700; font-size: .72rem;
      text-transform: uppercase; letter-spacing: .05em; color: #6c757d;
      padding: .35rem .9rem;
    }
    .fat-subtotal-row td {
      font-weight: 700; border-top: 1px solid #dee2e6; border-bottom: 2px solid #dee2e6;
    }
    .fat-empty { padding: 3rem 1.5rem; text-align: center; color: #6c757d; }

    .fat-filter-bar {
      background: #fff; margin: 0 1.5rem 1.5rem; border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06); padding: .85rem 1.25rem;
      display: flex; gap: .9rem; align-items: end; flex-wrap: wrap;
    }
    .fat-filter-field { display: flex; flex-direction: column; gap: .25rem; }
    .fat-filter-field label {
      font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
      color: #6c757d;
    }
    .fat-filter-field select, .fat-filter-field input[type=date] {
      font-size: .82rem; padding: .35rem .6rem; border: 1px solid #dee2e6; border-radius: 6px;
      min-width: 170px;
    }
    .fat-filter-actions { display: flex; gap: .5rem; }
    .btn-fat-filter {
      background: var(--fat-navy); border: none; color: #fff; font-size: .82rem;
      font-weight: 700; padding: .4rem 1rem; border-radius: 6px;
    }
    .btn-fat-clear {
      font-size: .82rem; color: #6c757d; padding: .4rem .6rem; text-decoration: none;
    }
    .btn-fat-clear:hover { color: #495057; }

    .fat-two-col { display: flex; gap: 1.5rem; margin: 0 1.5rem 1.5rem; }
    .fat-two-col .fat-section { flex: 1; margin: 0; }
    @media (max-width: 900px) { .fat-two-col { flex-direction: column; } }

    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>

{% include 'intranet/intranet_navbar.html' %}

<nav id="fat-navbar" class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'faturamento:resumo' %}">
      <i class="bi bi-cash-coin me-2"></i>Faturamento
    </a>
    <div class="d-flex gap-2">
      <a class="nav-link" href="{% url 'faturamento:resumo' %}">Análise Anual</a>
      <a class="nav-link" href="{% url 'faturamento:detalhado' %}">Resumo Detalhado</a>
    </div>
  </div>
</nav>

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
